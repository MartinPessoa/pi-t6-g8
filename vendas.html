<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas - Mercearia</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #111;
            padding: 10px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        h2 {
            margin-top: 32px;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .formulario label {
            font-weight: bold;
        }

        .formulario label input {
            display: block;
            width: 100%;
            margin-top: 4px;
        }

        .linha-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .linha-form label {
            flex: 1;
            min-width: 200px;
        }

        input {
            font-size: 1.2rem;
            padding: 14px;
            border: 2px solid #666;
            border-radius: 8px;
        }

        #venda-qtd {
            max-width: 160px;
        }

        button {
            font-size: 1.2rem;
            padding: 14px 20px;
            border: 0;
            border-radius: 8px;
            background: #005fcc;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0047a3;
        }

        .dica {
            margin: 0;
            color: #555;
        }

        #mensagem {
            margin: 12px 0;
            font-size: 1rem;
            color: #0a5;
            font-weight: bold;
        }

        #mensagem.erro {
            color: #c33;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        thead {
            background: #005fcc;
            color: #fff;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .btn-remover {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 0.95rem;
        }

        .btn-remover:hover {
            background: #c82333;
        }

        .vazio {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 1.1rem;
        }

        .data {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>🛒 Registrar venda</h1>

        <div class="formulario">
            <label>Quantidade vendida
                <input id="venda-qtd" type="number" min="1" step="1" value="1">
            </label>
            <div class="linha-form">
                <label>Produto
                    <input id="venda-nome" placeholder="Ex.: Arroz 5kg" autocomplete="off">
                </label>
                <label>Marca (opcional)
                    <input id="venda-marca" placeholder="Ex.: Tio João" autocomplete="off">
                </label>
            </div>
            <p class="dica" id="venda-dica"></p>
            <ul id="venda-produtos"></ul>
        </div>

        <p id="mensagem"></p>

        <h2>Últimas vendas</h2>
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-vendas">
                <tr class="vazio">
                    <td colspan="4">Carregando...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="db.js"></script>
    <script src="nav.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.1.0/fuse.min.js"></script>
    <script src="produtos.js"></script>
    <script>
        const qtdEl = document.getElementById("venda-qtd");
        const nomeEl = document.getElementById("venda-nome");
        const marcaEl = document.getElementById("venda-marca");
        const corpoVendasEl = document.getElementById("corpo-vendas");
        const msgEl = document.getElementById("mensagem");

        function formatarData(dataStr) {
            if (!dataStr) return "-";
            const data = new Date(dataStr);
            return data.toLocaleString("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        async function renderizarVendas() {
            try {
                const vendas = await listarVendas();
                if (vendas.length === 0) {
                    corpoVendasEl.innerHTML = `
                        <tr class="vazio">
                            <td colspan="4">Nenhuma venda registrada.</td>
                        </tr>
                    `;
                    return;
                }

                corpoVendasEl.innerHTML = vendas.map((venda) => {
                    return `
                        <tr>
                            <td><strong>${escaparHtml(textoProduto(venda))}</strong></td>
                            <td>${venda.quantidade}</td>
                            <td class="data">${formatarData(venda.data)}</td>
                            <td>
                                <button class="btn-remover" onclick="desfazerVenda(${venda.id})">
                                    Remover
                                </button>
                            </td>
                        </tr>
                    `;
                }).join("");
            } catch (erro) {
                msgEl.textContent = "Erro ao carregar as vendas.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        async function confirmarVenda(produto) {
            const quantidade = parseInt(qtdEl.value, 10);
            if (!(quantidade > 0)) {
                alert("Informe a quantidade vendida.");
                qtdEl.focus();
                return;
            }

            try {
                await registrarVenda(produto, quantidade);
                msgEl.textContent = `✓ Venda registrada: ${quantidade} × ${textoProduto(produto)}`;
                msgEl.classList.remove("erro");
                qtdEl.value = 1;
                nomeEl.value = "";
                marcaEl.value = "";
                await seletor.recarregar();
                await renderizarVendas();
                qtdEl.select();
            } catch (erro) {
                msgEl.textContent = "Erro ao registrar a venda.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        async function desfazerVenda(id) {
            if (!confirm("Tem certeza que deseja remover esta venda?")) {
                return;
            }

            try {
                await removerVenda(id);
                msgEl.textContent = "✓ Venda removida!";
                msgEl.classList.remove("erro");
                await seletor.recarregar();
                await renderizarVendas();
            } catch (erro) {
                msgEl.textContent = "Erro ao remover a venda.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        const seletor = criarSeletorProduto({
            nomeEl,
            marcaEl,
            dicaEl: document.getElementById("venda-dica"),
            listaEl: document.getElementById("venda-produtos"),
            aoEscolher: confirmarVenda
        });

        seletor.recarregar();
        renderizarVendas();
    </script>
</body>
</html>
