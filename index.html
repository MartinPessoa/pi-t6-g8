<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista da Mercearia</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #111;
            padding: 10px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .formulario {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .linha-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            font-size: 1.2rem;
            padding: 14px;
            border: 2px solid #666;
            border-radius: 8px;
        }

        button {
            font-size: 1.2rem;
            padding: 14px 20px;
            border: 0;
            border-radius: 8px;
            background: #005fcc;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0047a3;
        }

        #mensagem {
            margin: 12px 0;
            font-size: 1rem;
            color: #0a5;
            font-weight: bold;
        }

        #mensagem.erro {
            color: #c33;
        }

        .lista-container {
            margin-top: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        thead {
            background: #005fcc;
            color: #fff;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .btn-comprei {
            background: #198754;
            padding: 8px 12px;
            font-size: 0.95rem;
        }

        .btn-comprei:hover {
            background: #146c43;
        }

        .btn-remover {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 0.95rem;
        }

        .btn-remover:hover {
            background: #c82333;
        }

        .vazio {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 1.1rem;
        }

        .data {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 8px;
            }

            .acoes {
                flex-direction: column;
            }

            .btn-comprei, .btn-remover {
                width: 100%;
            }
        }

        .backup {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 2px solid #ddd;
        }

        .backup p {
            margin: 0 0 10px;
            color: #555;
        }

        #dialogo-compra {
            width: min(560px, calc(100vw - 32px));
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 12px;
        }

        #dialogo-compra::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        #dialogo-compra h2 {
            margin-top: 0;
        }

        #dialogo-compra label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
        }

        #dialogo-compra label input {
            display: block;
            width: 100%;
            margin-top: 4px;
        }

        #compra-sugestoes {
            list-style: none;
            margin: 0 0 12px;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        #compra-sugestoes li {
            margin-bottom: 6px;
        }

        #compra-sugestoes button {
            width: 100%;
            text-align: left;
            background: #f0f0f0;
            color: #111;
            border: 2px solid #ccc;
            font-weight: normal;
        }

        #compra-sugestoes button:hover {
            border-color: #005fcc;
        }

        #compra-sugestoes button.selecionado {
            background: #e7f1ff;
            border-color: #005fcc;
            font-weight: bold;
        }

        .dica {
            margin: 0 0 8px;
            color: #555;
        }

        #compra-escolha {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .botoes-dialogo {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-cancelar {
            background: #6c757d;
        }

        .btn-cancelar:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <main>
        <h1>📋 Lista da Mercearia</h1>

        <div class="formulario">
            <div class="linha-form">
                <input id="nome" placeholder="Ex.: Arroz, leite, pao" autocomplete="off">
                <input id="cliente" placeholder="Ex.: João Silva" autocomplete="off">
            </div>
            <button id="btn-salvar">Adicionar Item</button>
            <p id="mensagem"></p>
        </div>

        <div class="lista-container">
            <table id="tabela-recados">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-recados">
                    <tr class="vazio">
                        <td colspan="4">Nenhum item na lista. Adicione um novo item acima!</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="backup">
            <p>Os dados ficam salvos somente neste navegador. Faça backup de vez em quando.</p>
            <button id="btn-exportar" type="button">Exportar backup</button>
            <button id="btn-importar" type="button">Importar backup</button>
            <input id="arquivo-backup" type="file" accept=".db,.sqlite,.sqlite3" hidden>
        </div>
    </main>

    <dialog id="dialogo-compra">
        <form id="form-compra">
            <h2>🛒 Registrar compra</h2>
            <p>Pedido: <strong id="compra-pedido"></strong></p>

            <label>Produto
                <input id="compra-nome" autocomplete="off" required>
            </label>
            <label>Marca (opcional)
                <input id="compra-marca" autocomplete="off">
            </label>

            <p class="dica" id="compra-dica"></p>
            <ul id="compra-sugestoes"></ul>

            <label>Quantidade comprada
                <input id="compra-qtd" type="number" min="1" step="1" value="1" required>
            </label>

            <p id="compra-escolha"></p>

            <div class="botoes-dialogo">
                <button type="button" class="btn-cancelar" id="btn-compra-cancelar">Cancelar</button>
                <button type="submit">Registrar compra</button>
            </div>
        </form>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="db.js"></script>
    <script src="nav.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.1.0/fuse.min.js"></script>
    <script>
        const nomeEl = document.getElementById("nome");
        const clienteEl = document.getElementById("cliente");
        const corpoRecadosEl = document.getElementById("corpo-recados");
        const msgEl = document.getElementById("mensagem");
        const btnSalvarEl = document.getElementById("btn-salvar");
        let pedidos = [];

        function formatarData(dataStr) {
            if (!dataStr) return "-";
            const data = new Date(dataStr);
            return data.toLocaleString("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        async function renderizar() {
            try {
                const dados = await listarItens();
                pedidos = dados;

                if (dados.length === 0) {
                    corpoRecadosEl.innerHTML = `
                        <tr class="vazio">
                            <td colspan="4">Nenhum item na lista. Adicione um novo item acima!</td>
                        </tr>
                    `;
                    return;
                }

                corpoRecadosEl.innerHTML = dados.map((item) => {
                    return `
                        <tr>
                            <td><strong>${escaparHtml(item.nome)}</strong></td>
                            <td>${escaparHtml(item.cliente)}</td>
                            <td class="data">${formatarData(item.data_adicionado)}</td>
                            <td>
                                <div class="acoes">
                                    <button class="btn-comprei" onclick="abrirCompra(${item.id})">
                                        Comprei
                                    </button>
                                    <button class="btn-remover" onclick="removerItem(${item.id})">
                                        Remover
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join("");
            } catch (erro) {
                msgEl.textContent = "Erro ao carregar a lista.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        async function salvar() {
            const nome = nomeEl.value.trim();
            const cliente = clienteEl.value.trim();

            if (!nome || !cliente) {
                msgEl.textContent = "Por favor, preencha o item e o nome do cliente.";
                msgEl.classList.add("erro");
                return;
            }

            try {
                await adicionarItem(nome, cliente);

                msgEl.textContent = "✓ Item adicionado com sucesso!";
                msgEl.classList.remove("erro");
                nomeEl.value = "";
                clienteEl.value = "";
                nomeEl.focus();
                await renderizar();
            } catch (erro) {
                msgEl.textContent = "Erro ao salvar o item.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }


        async function removerItem(id) {
            if (!confirm("Tem certeza que deseja remover este item?")) {
                return;
            }

            try {
                await removerItemDoBanco(id);

                msgEl.textContent = "✓ Item removido!";
                msgEl.classList.remove("erro");
                await renderizar();
            } catch (erro) {
                msgEl.textContent = "Erro ao remover o item.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        // ---- Registrar compra ----
        const dialogoEl = document.getElementById("dialogo-compra");
        const formCompraEl = document.getElementById("form-compra");
        const compraPedidoEl = document.getElementById("compra-pedido");
        const compraNomeEl = document.getElementById("compra-nome");
        const compraMarcaEl = document.getElementById("compra-marca");
        const compraQtdEl = document.getElementById("compra-qtd");
        const compraDicaEl = document.getElementById("compra-dica");
        const compraSugestoesEl = document.getElementById("compra-sugestoes");
        const compraEscolhaEl = document.getElementById("compra-escolha");

        // Busca tolerante a erros de digitacao (ignora maiusculas e acentos).
        // Nome e marca sao buscados separadamente para a marca nao "confundir" o nome.
        const OPCOES_BUSCA = { threshold: 0.35, ignoreLocation: true, ignoreDiacritics: true };
        let produtos = [];
        let buscaNome;
        let buscaMarca;
        let pedidoAtual = null;
        let produtoSelecionado = null;

        function textoProduto(produto) {
            return produto.marca ? `${produto.nome} – ${produto.marca}` : produto.nome;
        }

        function mesmoTexto(a, b) {
            return a.localeCompare(b, "pt-BR", { sensitivity: "accent" }) === 0;
        }

        function buscarParecidos() {
            const nome = compraNomeEl.value.trim();
            const marca = compraMarcaEl.value.trim();
            if (!nome) return [];

            let encontrados = buscaNome.search(nome).map((r) => r.item);
            if (marca) {
                const comMarca = new Set(buscaMarca.search(marca).map((r) => r.item));
                encontrados = encontrados.filter((p) => comMarca.has(p));
            }
            return encontrados.slice(0, 8);
        }

        function atualizarEscolha() {
            const nome = compraNomeEl.value.trim();
            const marca = compraMarcaEl.value.trim();
            if (produtoSelecionado) {
                compraEscolhaEl.innerHTML = `✓ Produto já cadastrado: <strong>${escaparHtml(textoProduto(produtoSelecionado))}</strong>`;
            } else if (nome) {
                compraEscolhaEl.innerHTML = `➕ Será cadastrado um <strong>novo produto</strong>: ${escaparHtml(textoProduto({ nome, marca }))}`;
            } else {
                compraEscolhaEl.textContent = "Digite o nome do produto.";
            }
        }

        function renderizarSugestoes() {
            const parecidos = buscarParecidos();
            compraDicaEl.textContent = parecidos.length
                ? "Produtos já cadastrados parecidos (toque para escolher):"
                : "Nenhum produto parecido cadastrado.";

            compraSugestoesEl.innerHTML = "";
            parecidos.forEach((produto) => {
                const botao = document.createElement("button");
                botao.type = "button";
                botao.textContent = textoProduto(produto);
                if (produto === produtoSelecionado) {
                    botao.className = "selecionado";
                }
                botao.addEventListener("click", () => {
                    produtoSelecionado = produto;
                    compraNomeEl.value = produto.nome;
                    compraMarcaEl.value = produto.marca;
                    renderizarSugestoes();
                    compraQtdEl.focus();
                });
                const li = document.createElement("li");
                li.appendChild(botao);
                compraSugestoesEl.appendChild(li);
            });
            atualizarEscolha();
        }

        function aoDigitarProduto() {
            produtoSelecionado = null;
            renderizarSugestoes();
        }

        async function abrirCompra(id) {
            pedidoAtual = pedidos.find((p) => p.id === id);
            if (!pedidoAtual) return;

            produtos = await listarProdutos();
            buscaNome = new Fuse(produtos, { ...OPCOES_BUSCA, keys: ["nome"] });
            buscaMarca = new Fuse(produtos, { ...OPCOES_BUSCA, keys: ["marca"] });

            compraPedidoEl.textContent = `${pedidoAtual.nome} (cliente: ${pedidoAtual.cliente})`;
            compraNomeEl.value = pedidoAtual.nome;
            compraMarcaEl.value = "";
            compraQtdEl.value = 1;
            produtoSelecionado = null;
            renderizarSugestoes();
            dialogoEl.showModal();
            compraNomeEl.focus();
        }

        async function confirmarCompra(event) {
            event.preventDefault();
            const nome = compraNomeEl.value.trim();
            const marca = compraMarcaEl.value.trim();
            const quantidade = parseInt(compraQtdEl.value, 10);
            if (!nome || !(quantidade > 0)) return;

            // Mesmo nome e marca de um produto existente: usa ele sem perguntar.
            const produto = produtoSelecionado
                || produtos.find((p) => mesmoTexto(p.nome, nome) && mesmoTexto(p.marca, marca));
            if (!produto && !confirm(`Cadastrar o novo produto "${textoProduto({ nome, marca })}"?`)) {
                return;
            }

            try {
                await registrarCompra({
                    itemId: pedidoAtual.id,
                    produtoId: produto ? produto.id : null,
                    nome,
                    marca,
                    quantidade
                });
                dialogoEl.close();
                msgEl.textContent = `✓ Compra registrada: ${quantidade} × ${textoProduto(produto || { nome, marca })}`;
                msgEl.classList.remove("erro");
                await renderizar();
            } catch (erro) {
                dialogoEl.close();
                msgEl.textContent = "Erro ao registrar a compra.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        }

        compraNomeEl.addEventListener("input", aoDigitarProduto);
        compraMarcaEl.addEventListener("input", aoDigitarProduto);
        formCompraEl.addEventListener("submit", confirmarCompra);
        document.getElementById("btn-compra-cancelar").addEventListener("click", () => dialogoEl.close());

        btnSalvarEl.addEventListener("click", salvar);
        nomeEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                clienteEl.focus();
            }
        });
        clienteEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                salvar();
            }
        });

        document.getElementById("btn-exportar").addEventListener("click", exportarBanco);
        const arquivoBackupEl = document.getElementById("arquivo-backup");
        document.getElementById("btn-importar").addEventListener("click", () => arquivoBackupEl.click());
        arquivoBackupEl.addEventListener("change", async () => {
            const arquivo = arquivoBackupEl.files[0];
            arquivoBackupEl.value = "";
            if (!arquivo) return;
            if (!confirm("Importar o backup vai substituir a lista atual. Continuar?")) return;
            try {
                await importarBanco(arquivo);
                msgEl.textContent = "✓ Backup importado!";
                msgEl.classList.remove("erro");
                await renderizar();
            } catch (erro) {
                msgEl.textContent = "Arquivo de backup inválido.";
                msgEl.classList.add("erro");
                console.error(erro);
            }
        });

        renderizar();
    </script>
</body>
</html>
